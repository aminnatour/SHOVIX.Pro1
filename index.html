
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#050505">

    <title>روابطي | Facebook & Instagram</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- الخلفية -->
    <div class="background">
        <div class="background-overlay"></div>
    </div>

    <!-- المحتوى -->
    <main class="container">

        <!-- البروفايل -->
        <section class="profile">

            <div class="avatar">
    <img src="logo.jpeg" >
</div>

            <h1>الثانويه التكنولوجيه قلنسوه</h1>

            <div class="username">
                @Mahatqlanswa
            </div>

            <p class="description">
                جميع حساباتي وروابطي في مكان واحد
            </p>

        </section>


        <!-- الروابط -->
        <section class="links">

            <!-- Facebook -->
            <a
                class="link-card facebook"
                href="https://www.facebook.com/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="link-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <path d="M14 8h3V4h-3c-3.31 0-5 1.69-5 5v3H6v4h3v8h4v-8h3l1-4h-4V9c0-.66.34-1 1-1z"/>
                    </svg>

                </div>

                <div class="link-content">

                    <strong>Facebook</strong>

                    <span>
                        تابعني على فيسبوك
                    </span>

                </div>

                <div class="arrow">
                    ←
                </div>

            </a>


            <!-- Instagram -->
            <a
                class="link-card instagram"
                href="https://www.instagram.com/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="link-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        aria-hidden="true"
                    >
                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="5"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="4"
                        />

                        <circle
                            cx="17.5"
                            cy="6.5"
                            r="1"
                            fill="currentColor"
                            stroke="none"
                        />
                    </svg>

                </div>

                <div class="link-content">

                    <strong>Instagram</strong>

                    <span>
                        تابعني على إنستغرام
                    </span>

                </div>

                <div class="arrow">
                    ←
                </div>

            </a>

        </section>


        <!-- Footer -->
        <footer>

            <div class="footer-logo">
          
            </div>

            <p>
              
            </p>

        </footer>

    </main>


    <!-- رسالة صغيرة -->
    <div
        class="toast"
        id="toast"
    >
        تم فتح الرابط
    </div>


    <script src="script.js"></script>

</body>

</html>
